        window.loadExams = function() {
            const major = document.getElementById('major').value;
            const year = document.getElementById('year').value;
            const examContainer = document.getElementById('exam-container');
            const submitBtn = document.getElementById('submit-btn');
            
            examContainer.innerHTML = ''; // Clear old

            if(major && year && examDatabase[major] && examDatabase[major][year]) {
                const subjects = examDatabase[major][year];
                let htmlStr = '';

                for(const [subjectName, questions] of Object.entries(subjects)) {
                    htmlStr += `<div class="subject-card">
                                    <div class="subject-title">${subjectName}</div>`;
                    
                    questions.forEach((item, index) => {
                        htmlStr += `
                            <div class="question-block">
                                <p><strong>ข้อ ${index + 1}:</strong> ${item.q}</p>
                                <div class="choices">
                        `;
                        item.choices.forEach((choice, cIndex) => {
                            htmlStr += `
                                <label class="radio-label">
                                    <input type="radio" name="${subjectName}_q${index}" value="${cIndex}">
                                    ${choice}
                                </label>
                            `;
                        });
                        htmlStr += `</div></div>`;
                    });
                    htmlStr += `</div>`;
                }
                examContainer.innerHTML = htmlStr;
                submitBtn.style.display = 'block';
            } else {
                examContainer.innerHTML = '<p class="error-text">กรุณาเลือกสาขาและชั้นปีที่มีในระบบ หรือยังไม่มีข้อมูลข้อสอบในหมวดนี้</p>';
                submitBtn.style.display = 'none';
            }
        }

        window.submitExam = async function() {
            const studentName = document.getElementById('student_name').value;
            const major = document.getElementById('major').value;
            const year = document.getElementById('year').value;

            if(!studentName) {
                alert("กรุณากรอกชื่อ-นามสกุลก่อนส่งข้อสอบ");
                return;
            }

            const subjects = examDatabase[major][year];
            let resultsHTML = `<div class="result-header">ผลการสอบของ: ${studentName}</div>`;
            let resultsHTMLTable = `<table class="result-table">
                                        <tr><th>รายวิชา</th><th>คะแนน</th><th>เกรด</th></tr>`;
            
            let totalGradePoints = 0;
            let subjectCount = 0;
            let finalRecord = {
                name: studentName,
                major: major,
                year: year,
                timestamp: serverTimestamp(),
                grades: {}
            };

            for(const [subjectName, questions] of Object.entries(subjects)) {
                let score = 0;
                questions.forEach((item, index) => {
                    const selected = document.querySelector(`input[name="${subjectName}_q${index}"]:checked`);
                    if(selected && parseInt(selected.value) === item.ans) {
                        score += 1;
                    }
                });

                // คำนวณเกรดอิงเกณฑ์ (10 คะแนนเต็ม)
                let gradeText = "";
                let gradePoint = 0;
                if(score >= 9) { gradeText = "A"; gradePoint = 4.0; }
                else if(score >= 8) { gradeText = "B+"; gradePoint = 3.5; }
                else if(score >= 7) { gradeText = "B"; gradePoint = 3.0; }
                else if(score >= 6) { gradeText = "C+"; gradePoint = 2.5; }
                else if(score >= 5) { gradeText = "C"; gradePoint = 2.0; }
                else if(score >= 4) { gradeText = "D+"; gradePoint = 1.5; }
                else if(score >= 3) { gradeText = "D"; gradePoint = 1.0; }
                else { gradeText = "F"; gradePoint = 0.0; }

                totalGradePoints += gradePoint;
                subjectCount++;

                resultsHTMLTable += `<tr>
                                        <td>${subjectName}</td>
                                        <td>${score}/10</td>
                                        <td class="grade-${gradeText.replace('+','plus')}">${gradeText}</td>
                                     </tr>`;
                
                finalRecord.grades[subjectName] = { score: score, grade: gradeText };
            }

            let gpa = (totalGradePoints / subjectCount).toFixed(2);
            resultsHTMLTable += `</table>`;
            resultsHTML += resultsHTMLTable;
            resultsHTML += `<div class="gpa-box">เกรดเฉลี่ยภาคเรียนนี้ (GPA): <strong>${gpa}</strong></div>`;

            finalRecord.gpa = parseFloat(gpa);

            // บันทึกข้อมูลลง Firebase
            document.getElementById('submit-btn').innerText = "กำลังบันทึกข้อมูล...";
            document.getElementById('submit-btn').disabled = true;

            try {
                await addDoc(collection(db, "exam_results"), finalRecord);
                document.getElementById('result-container').innerHTML = resultsHTML;
                document.getElementById('result-container').style.display = 'block';
                document.getElementById('exam-container').style.display = 'none';
                document.getElementById('submit-btn').style.display = 'none';
                document.getElementById('setup-form').style.display = 'none';
                alert("ส่งข้อสอบและบันทึกข้อมูลสำเร็จ!");
            } catch (e) {
                console.error("Error adding document: ", e);
                alert("เกิดข้อผิดพลาดในการบันทึกข้อมูล โปรดตรวจสอบคอนโซล");
                document.getElementById('submit-btn').innerText = "ส่งข้อสอบและประมวลผลเกรด";
                document.getElementById('submit-btn').disabled = false;
            }
        }
    </script>
