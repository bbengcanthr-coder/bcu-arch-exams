<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสอบกลางภาค - คณะสถาปัตยกรรมศาสตร์และการออกแบบ มหาวิทยาลัยเบงจันทร์</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #002147; /* สีกรมท่า */
            --secondary-color: #003366;
            --bg-color: #ffffff;
            --text-color: #333333;
            --border-color: #e0e0e0;
        }
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        header {
            background-color: var(--primary-color);
            color: white;
            text-align: center;
            padding: 20px 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        header h1 {
            font-size: 1.2rem;
            margin: 0;
            font-weight: 600;
        }
        header h2 {
            font-size: 1rem;
            margin: 5px 0 0 0;
            font-weight: 400;
            color: #d1d9e6;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .card {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--primary-color);
        }
        input[type="text"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-family: 'Sarabun', sans-serif;
            font-size: 1rem;
            box-sizing: border-box;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            width: 100%;
            font-size: 1rem;
            font-family: 'Sarabun', sans-serif;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: var(--secondary-color);
        }
        .question-block {
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px dashed var(--border-color);
        }
        .question-text {
            font-weight: 600;
            margin-bottom: 10px;
        }
        .choice-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 400;
            cursor: pointer;
        }
        .subject-title {
            color: var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 5px;
            margin-top: 30px;
        }
        .result-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        .result-table th, .result-table td {
            border: 1px solid var(--border-color);
            padding: 10px;
            text-align: center;
        }
        .result-table th {
            background-color: var(--primary-color);
            color: white;
        }
        #examArea, #resultArea {
            display: none;
        }
        .loading {
            text-align: center;
            color: var(--primary-color);
            font-weight: 600;
            display: none;
        }
    </style>
</head>
<body>

<header>
    <h1>ข้อสอบกลางภาค คณะสถาปัตยกรรมศาสตร์และการออกแบบ</h1>
    <h2>มหาวิทยาลัยเบงจันทร์ ปีการศึกษา 2569</h2>
</header>

<div class="container">
    <div id="registerArea" class="card">
        <div class="form-group">
            <label for="studentName">ชื่อ-นามสกุล (ผู้เข้าสอบ)</label>
            <input type="text" id="studentName" placeholder="กรอกชื่อ-นามสกุล" required>
        </div>
        <div class="form-group">
            <label for="major">สาขาวิชา</label>
            <select id="major" required>
                <option value="">-- เลือกสาขาวิชา --</option>
                <option value="arch">สาขาวิชาสถาปัตยกรรม (5 ปี)</option>
                <option value="interior">สาขาวิชาออกแบบภายใน</option>
                <option value="product">สาขาวิชาศิลปประยุกต์และออกแบบผลิตภัณฑ์</option>
                <option value="urban">สาขาวิชาสถาปัตยกรรมผังเมือง</option>
            </select>
        </div>
        <div class="form-group">
            <label for="year">ชั้นปี</label>
            <select id="year" required>
                <option value="">-- เลือกชั้นปี --</option>
                <option value="1">ปี 1 เทอม 1</option>
                <option value="2">ปี 2 เทอม 1</option>
                <option value="3">ปี 3 เทอม 1</option>
                <option value="4">ปี 4 เทอม 1</option>
                <option value="5" id="optYear5">ปี 5 เทอม 1</option>
            </select>
        </div>
        <button onclick="startExam()">เริ่มทำข้อสอบ</button>
    </div>

    <div id="examArea" class="card">
        <h3 id="examHeader" style="text-align: center; color: var(--primary-color);"></h3>
        <div id="questionsContainer"></div>
        <button onclick="submitExam()" style="margin-top: 20px;">ส่งคำตอบและดูผลคะแนน</button>
        <div id="loading" class="loading"><br>กำลังบันทึกข้อมูล...</div>
    </div>

    <div id="resultArea" class="card">
        <h3 style="text-align: center; color: var(--primary-color);">ผลการเรียนของ <span id="resName"></span></h3>
        <table class="result-table">
            <thead>
                <tr>
                    <th>รายวิชา</th>
                    <th>คะแนน (10)</th>
                    <th>เกรด</th>
                    <th>แต้มระดับคะแนน (GPA)</th>
                </tr>
            </thead>
            <tbody id="resultBody"></tbody>
        </table>
        <h3 style="text-align: right; margin-top: 20px;">เกรดเฉลี่ย (GPA): <span id="finalGPA"></span></h3>
        <button onclick="location.reload()">กลับสู่หน้าหลัก</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBZD0kxpEOUFemz661kS9KH_YUu3P4zhco",
  authDomain: "bcu-architecture-exam.firebaseapp.com",
  projectId: "bcu-architecture-exam",
  storageBucket: "bcu-architecture-exam.firebasestorage.app",
  messagingSenderId: "508004501183",
  appId: "1:508004501183:web:704bec70a9c19e42bb280a",
  measurementId: "G-RP5927DR5F"
};

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // ฐานข้อมูลข้อสอบ (โครงสร้างตัวอย่างแบบละเอียด วิชาการขั้นสูง)
    const examDatabase = {
        "arch": {
            "1": [
                {
                    subject: "การออกแบบสถาปัตยกรรมพื้นฐาน 1",
                    questions: [
                        { q: "หลักการของ Modulor ที่คิดค้นโดย Le Corbusier อ้างอิงจากสิ่งใดเป็นหลัก?", choices: ["สัดส่วนทองคำและสัดส่วนมนุษย์", "การโคจรของดวงอาทิตย์", "โครงสร้างของต้นไม้", "กฎเรขาคณิตแบบสมมาตร"], ans: 0 },
                        { q: "Gestalt Principles ข้อใดที่อธิบายถึงการที่สมองมนุษย์จัดกลุ่มองค์ประกอบที่อยู่ใกล้กันให้เป็นหมวดหมู่เดียวกัน?", choices: ["Law of Similarity", "Law of Proximity", "Law of Closure", "Law of Continuity"], ans: 1 },
                        { q: "การออกแบบพื้นที่ที่มีลักษณะกึ่งเปิดกึ่งปิด (Semi-outdoor) ในสถาปัตยกรรมเขตร้อนชื้น มีจุดประสงค์หลักเพื่ออะไร?", choices: ["เพิ่มพื้นที่ขาย", "ควบคุมอุณหภูมิและกระแสลมธรรมชาติ (Cross Ventilation)", "ลดการใช้โครงสร้างรับน้ำหนัก", "ป้องกันเสียงรบกวน"], ans: 1 },
                        { q: "Space Hierarchy หรือลำดับความสำคัญของที่ว่าง สามารถแสดงออกได้ชัดเจนที่สุดผ่านวิธีใด?", choices: ["การทาสีผนังแบบเดียวกัน", "การเปลี่ยนระดับฝ้าเพดานและการเล่นระดับพื้น", "การเลือกใช้เฟอร์นิเจอร์แบรนด์เนม", "การใช้ระบบแสงสว่างแบบสม่ำเสมอทั่วห้อง"], ans: 1 },
                        { q: "ข้อใดคือความหมายของ 'Form Follows Function' ของ Louis Sullivan?", choices: ["รูปทรงของอาคารควรสอดคล้องกับประโยชน์ใช้สอย", "ประโยชน์ใช้สอยต้องปรับตัวเข้าหารูปทรง", "รูปทรงมีความสำคัญกว่าประโยชน์ใช้สอย", "การตกแต่งคือสิ่งจำเป็นสำหรับสถาปัตยกรรม"], ans: 0 },
                        { q: "การวางผังการสัญจร (Circulation) แบบ Radial มีลักษณะอย่างไร?", choices: ["เส้นทางเดินเป็นเส้นตรงยาว", "เส้นทางเดินแผ่ออกเป็นรัศมีจากจุดศูนย์กลาง", "เส้นทางเดินเป็นตารางกริด", "เส้นทางเดินไม่มีทิศทางที่ชัดเจน"], ans: 1 },
                        { q: "มิติพื้นฐานของการวิเคราะห์พื้นที่ (Site Analysis) ที่ส่งผลต่อการวางทิศทางอาคารในประเทศไทยมากที่สุดคือข้อใด?", choices: ["ความสูงของอาคารข้างเคียง", "แนวแกนทิศเหนือ-ใต้ และเส้นทางโคจรของดวงอาทิตย์", "ประเภทของดิน", "ลักษณะทางประชากรศาสตร์"], ans: 1 },
                        { q: "หลักการ Solid & Void ในการออกแบบ Facade อาคาร หมายถึงสิ่งใด?", choices: ["ความทึบตันและความโปร่งโล่งของเปลือกอาคาร", "ความแข็งแรงและจุดอ่อนของโครงสร้าง", "การใช้วัสดุคอนกรีตและเหล็ก", "การออกแบบหลังคาและพื้น"], ans: 0 },
                        { q: "กระบวนการ Bubble Diagram ในการออกแบบสถาปัตยกรรมใช้เพื่อวิเคราะห์เรื่องใดเป็นหลัก?", choices: ["โครงสร้างทางวิศวกรรม", "ความสัมพันธ์ของพื้นที่ใช้สอย (Zoning & Relationship)", "งบประมาณการก่อสร้าง", "การตกแต่งภายใน"], ans: 1 },
                        { q: "การศึกษา Anthropometry มีความสำคัญต่อสถาปนิกในด้านใด?", choices: ["การคำนวณโครงสร้างรับแรงลม", "การออกแบบสัดส่วนอาคารและช่องเปิดให้เหมาะสมกับสรีระมนุษย์", "การเลือกพันธุ์ไม้สำหรับจัดสวน", "การประเมินราคาค่าก่อสร้าง"], ans: 1 }
                    ]
                },
                {
                    subject: "การวาดเส้นและแสดงแบบสถาปัตยกรรม 1",
                    questions: [
                        { q: "การเขียนแบบ Perspective แบบ 2 จุด (2-Point Perspective) เหมาะสำหรับการนำเสนออาคารในมุมมองใดมากที่สุด?", choices: ["มองหน้าตรงเห็นเฉพาะด้านหน้า", "มองจากมุมเฉียงเห็นสองด้านของอาคาร", "มองจากมุมมองนกบิน (Bird's-eye view)", "มองผังพื้นจากด้านบน"], ans: 1 },
                        { q: "น้ำหนักเส้น (Line Weight) ในการเขียนแบบรูปตัด (Section) เส้นประเภทใดควรมีน้ำหนักเข้มที่สุด?", choices: ["เส้นร่าง (Construction Line)", "เส้นบอกระยะ (Dimension Line)", "เส้นที่ถูกตัดผ่าน (Cut Line)", "เส้นแสดงลวดลายวัสดุ (Hatch Line)"], ans: 2 },
                        { q: "มาตราส่วน (Scale) 1:100 มีความหมายตามข้อใด?", class: "math", choices: ["1 เซนติเมตรในแบบ เท่ากับ 1 เมตรในพื้นที่จริง", "1 เมตรในแบบ เท่ากับ 100 เมตรในพื้นที่จริง", "1 มิลลิเมตรในแบบ เท่ากับ 1 เมตรในพื้นที่จริง", "1 นิ้วในแบบ เท่ากับ 100 ฟุตในพื้นที่จริง"], ans: 0 },
                        { q: "สัญลักษณ์เรขาคณิตวงกลมที่มีเส้นผ่าศูนย์กลางลากผ่านและระบายสีดำครึ่งหนึ่ง ในแบบสถาปัตยกรรมมักหมายถึงอะไร?", choices: ["ทิศเหนือ", "ระดับความสูง (Elevation Level)", "แนวเขตที่ดิน", "ตำแหน่งดวงโคมไฟ"], ans: 1 },
                        { q: "การเขียนแบบ Isometric แกนหลักทั้ง 3 แกน ทำมุมเอียงจากแกนระนาบนอนกี่องศา?", choices: ["15 องศา และ 45 องศา", "30 องศา และ 30 องศา", "45 องศา และ 45 องศา", "60 องศา และ 60 องศา"], ans: 1 },
                        { q: "Title Block ของแบบก่อสร้าง สิ่งที่ขาดไม่ได้คือข้อใด?", choices: ["ชื่อสถาปนิก มาตราส่วน และชื่อโครงการ", "ประวัติเจ้าของโครงการ", "รูปทัศนียภาพสี", "รายการคำนวณโครงสร้าง"], ans: 0 },
                        { q: "Orthographic Projection คือหลักการเขียนแบบที่อ้างอิงจากอะไร?", choices: ["การฉายภาพแบบขนานตั้งฉากกับระนาบรับภาพ", "การรวมจุดสายตาไว้ที่จุดเดียว", "การร่างภาพด้วยมือเปล่า", "การใช้แสงและเงาแบบสมจริง"], ans: 0 },
                        { q: "ในการ Render แสงเงาดินสอ (Graphite Rendering) เทคนิค 'Cross-hatching' คืออะไร?", choices: ["การฝนดินสอให้เรียบเนียน", "การขีดเส้นตัดกันเป็นตาข่ายเพื่อสร้างน้ำหนักเงา", "การจุดด้วยปลายดินสอ", "การใช้กระดาษทิชชู่เกลี่ยสี"], ans: 1 },
                        { q: "เส้นประ (Dashed Line) ในผังพื้น (Floor Plan) ใช้แสดงถึงสิ่งใด?", choices: ["แนวผนังที่ถูกตัด", "องค์ประกอบที่อยู่เหนือระดับสายตาขึ้นไป (เช่น แนวชายคา)", "แนวทางเดินสัญจร", "เส้นบอกอาณาเขตที่ดิน"], ans: 1 },
                        { q: "หากต้องการแสดงความลึกของระเบียงในรูปด้าน (Elevation) สถาปนิกควรใช้เทคนิคใด?", choices: ["การปรับใช้น้ำหนักเส้นที่อ่อนลงสำหรับส่วนที่อยู่ไกลออกไป", "การใช้เส้นที่หนาขึ้นสำหรับส่วนที่อยู่ไกล", "การไม่ใส่รายละเอียดใดๆ ในส่วนที่อยู่ไกล", "การเขียนบรรยายด้วยข้อความ"], ans: 0 }
                    ]
                }
                // *หมายเหตุ: สามารถเพิ่มวิชาอื่นๆ เช่น ทัศนศิลป์พื้นฐาน, คณิตศาสตร์สำหรับสถาปนิก(GE), ภาษาไทยฯ(GE), ภาษาอังกฤษฯ(GE) ได้ตามโครงสร้างอาร์เรย์นี้ โดยแต่ละวิชามี 10 ข้อ
            ]
        }
    };

    window.startExam = function() {
        const name = document.getElementById("studentName").value;
        const major = document.getElementById("major").value;
        const year = document.getElementById("year").value;

        if (!name || !major || !year) {
            alert("กรุณากรอกข้อมูลให้ครบถ้วน");
            return;
        }

        // ตรวจสอบว่ามีข้อมูลข้อสอบในระบบหรือไม่
        if (!examDatabase[major] || !examDatabase[major][year]) {
            alert("ขออภัย กำลังอัปเดตข้อสอบสำหรับสาขา/ชั้นปีนี้ (สามารถทดสอบได้ที่: สาขาสถาปัตยกรรม ปี 1 เทอม 1)");
            return;
        }

        const subjects = examDatabase[major][year];
        let html = '';

        subjects.forEach((subj, subjIndex) => {
            html += `<div class="subject-title"><h4>วิชา: ${subj.subject}</h4></div>`;
            subj.questions.forEach((q, qIndex) => {
                html += `<div class="question-block">`;
                html += `<div class="question-text">${qIndex + 1}. ${q.q}</div>`;
                q.choices.forEach((choice, cIndex) => {
                    html += `<label class="choice-label">
                        <input type="radio" name="q_${subjIndex}_${qIndex}" value="${cIndex}"> ${choice}
                    </label>`;
                });
                html += `</div>`;
            });
        });

        document.getElementById("examHeader").innerText = `ข้อสอบ ${document.getElementById("major").options[document.getElementById("major").selectedIndex].text} - ${document.getElementById("year").options[document.getElementById("year").selectedIndex].text}`;
        document.getElementById("questionsContainer").innerHTML = html;
        
        document.getElementById("registerArea").style.display = "none";
        document.getElementById("examArea").style.display = "block";
    }

    window.submitExam = async function() {
        const name = document.getElementById("studentName").value;
        const major = document.getElementById("major").value;
        const year = document.getElementById("year").value;
        const subjects = examDatabase[major][year];
        
        document.getElementById("loading").style.display = "block";

        let results = [];
        let totalGPA = 0;

        subjects.forEach((subj, subjIndex) => {
            let score = 0;
            subj.questions.forEach((q, qIndex) => {
                const selected = document.querySelector(`input[name="q_${subjIndex}_${qIndex}"]:checked`);
                if (selected && parseInt(selected.value) === q.ans) {
                    score++;
                }
            });

            // ระบบตัดเกรด (ตามมาตรฐานมหาวิทยาลัย)
            let grade = 'F';
            let gpa = 0.0;
            if (score >= 9) { grade = 'A'; gpa = 4.0; }
            else if (score >= 8) { grade = 'B+'; gpa = 3.5; }
            else if (score >= 7) { grade = 'B'; gpa = 3.0; }
            else if (score >= 6) { grade = 'C+'; gpa = 2.5; }
            else if (score >= 5) { grade = 'C'; gpa = 2.0; }
            else if (score >= 4) { grade = 'D+'; gpa = 1.5; }
            else if (score >= 3) { grade = 'D'; gpa = 1.0; }

            results.push({ subject: subj.subject, score: score, grade: grade, gpa: gpa });
            totalGPA += gpa;
        });

        const averageGPA = (totalGPA / subjects.length).toFixed(2);

        // บันทึกลง Firebase (จะทำงานได้เมื่อใส่ Config จริง)
        try {
            await addDoc(collection(db, "exam_results"), {
                name: name,
                major: major,
                year: year,
                results: results,
                final_gpa: averageGPA,
                timestamp: serverTimestamp()
            });
        } catch (e) {
            console.error("Error adding document: ", e);
            // แจ้งเตือนเงียบๆ กรณีไม่ได้เชื่อมต่อ Database แต่ให้ดูผลสอบได้
            console.log("บันทึกข้อมูลแบบออฟไลน์ (โปรดเชื่อมต่อ Firebase เพื่อบันทึกจริง)");
        }

        // แสดงผล
        let resultHtml = '';
        results.forEach(res => {
            resultHtml += `<tr>
                <td style="text-align:left;">${res.subject}</td>
                <td>${res.score}/10</td>
                <td><strong>${res.grade}</strong></td>
                <td>${res.gpa.toFixed(2)}</td>
            </tr>`;
        });

        document.getElementById("resName").innerText = name;
        document.getElementById("resultBody").innerHTML = resultHtml;
        document.getElementById("finalGPA").innerText = averageGPA;

        document.getElementById("loading").style.display = "none";
        document.getElementById("examArea").style.display = "none";
        document.getElementById("resultArea").style.display = "block";
    }

    // จัดการ Dropdown ปี 5 (มีเฉพาะถาปัตย์หลัก)
    document.getElementById("major").addEventListener("change", function() {
        if(this.value === "arch") {
            document.getElementById("optYear5").style.display = "block";
        } else {
            document.getElementById("optYear5").style.display = "none";
            if(document.getElementById("year").value === "5") document.getElementById("year").value = "";
        }
    });
</script>
</body>
</html>
